  :root {
    --bg: #120d1a;
    --panel: #1d1529;
    --panel-2: #271c37;
    --line: #3a2b50;
    --text: #f4eefb;
    --muted: #b9abcc;
    --accent: #ff9a3c;
    --accent-ink: #1a0f05;
    --focus: #ffd166;
    --ok: #8be28b;
    --bad: #ff8a8a;
    --radius: 14px;
    --control-radius: 4px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 Inter, system-ui, -apple-system, sans-serif;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--control-radius); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }

  header { padding: 28px 0 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
  h1 { font-family: Creepster, Inter, sans-serif; font-weight: 400; letter-spacing: .03em;
       font-size: clamp(2.2rem, 7vw, 3.6rem); line-height: 1; margin: 0; color: var(--accent); }
  .tagline { margin: 6px 0 0; color: var(--muted); }
  .dates { margin-top: 10px; gap: 8px 14px; font-size: 14px; }
  .dates label { margin: 0; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .dates input[type=date] { width: auto; padding: 6px 8px; background: var(--panel); color-scheme: dark; }
  .linkbtn { appearance: none; border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600;
             text-decoration: underline; cursor: pointer; padding: 4px 2px; }
  .day h2 .count { color: var(--muted); font-size: .9rem; font-weight: 600; }

  .btn { appearance: none; border: 0; border-radius: var(--control-radius); padding: 11px 18px; font: inherit; font-weight: 700;
         background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
  .btn[disabled] { opacity: .6; cursor: progress; }

  .controls { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
              backdrop-filter: blur(8px); padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .search { flex: 1 1 220px; min-width: 0; padding: 10px 14px; border-radius: var(--control-radius); border: 1px solid var(--line);
            background: var(--panel); color: var(--text); font: inherit; }
  .chips { margin-top: 10px; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--text);
          border-radius: var(--control-radius); padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .chip .n { opacity: .7; margin-left: 4px; }
  .seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: var(--control-radius); overflow: hidden; }
  .seg button { appearance: none; border: 0; background: var(--panel); color: var(--text); font: inherit; font-size: 14px;
                padding: 7px 10px; cursor: pointer; white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .day { margin-top: 28px; }
  .day + .day { border-top: 2px solid var(--line); padding-top: 24px; }
  .day h2 { font-size: 1.15rem; margin: 0 0 12px; display: flex; gap: 10px; align-items: baseline; }
  .day h2 .rel { color: var(--accent); font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
          display: flex; flex-direction: column; }
  .flier { display: block; width: 100%; aspect-ratio: 4 / 5; background: var(--panel-2); border: 0; padding: 0; cursor: zoom-in; }
  .flier img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .flier.none { display: grid; place-items: center; font-size: 3rem; cursor: default; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .meta { color: var(--muted); font-size: 14px; }
  .when { color: var(--accent); font-weight: 700; font-size: 14px; }
  .card h3 { margin: 0; font-size: 1.05rem; line-height: 1.25; }
  .price { font-size: 14px; font-weight: 600; }
  .unknown { color: var(--muted); font-weight: 400; font-style: italic; }
  .ntaflof { align-self: flex-start; font-size: 12px; font-weight: 600; color: #a8f0c6; border: 1px solid color-mix(in srgb, #a8f0c6 50%, transparent);
             border-radius: var(--control-radius); padding: 2px 7px; }
  .desc { margin: 0; font-size: 14px; }
  .foot { margin-top: auto; padding-top: 6px; display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; }
  .tag { --c: var(--muted); appearance: none; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
         color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
         border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: 999px; padding: 2px 9px; }
  .tag:hover, .tag[aria-pressed="true"] { background: var(--c); color: var(--bg); }
  .chip[aria-pressed="true"][style] { background: var(--c); border-color: var(--c); }
  .chip[aria-pressed="true"] .dot { background: var(--accent-ink); }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }

  .seg.view { margin-left: auto; }
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  .tbl thead th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
                  padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tbl td { padding: 10px; vertical-align: top; border-bottom: 1px solid var(--line); }
  .tbl .dayrow th { text-align: left; font-size: 1.05rem; padding: 22px 10px 8px; border-bottom: 2px solid var(--line); }
  .tbl .dayrow .rel { color: var(--accent); font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .tbl .dayrow .count { color: var(--muted); font-size: .85rem; font-weight: 600; }
  .tbl .c-flier { width: 64px; }
  .tbl .c-time { white-space: nowrap; color: var(--accent); font-weight: 700; }
  .tbl .c-price { white-space: nowrap; }
  .tbl .c-src { white-space: nowrap; }
  .tbl .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .tbl .sub.one { max-width: 40ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tbl .sub.ok { color: #a8f0c6; }
  .tbl tbody tr.ev-row:hover td { background: color-mix(in srgb, var(--panel) 70%, transparent); }
  .mini { display: block; width: 48px; height: 60px; padding: 0; border: 1px solid var(--line); border-radius: var(--control-radius);
          background: var(--panel-2); overflow: hidden; cursor: zoom-in; }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini.none { display: grid; place-items: center; cursor: default; }
  .statusbar { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .statusbar[hidden] { display: none; }
  .statusbar .linkbtn { font-size: 13px; }
  .newver { color: var(--focus); font-weight: 600; }
  .newver a { color: var(--focus); }
  .site-foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .site-foot p { margin: 0; max-width: 70ch; }
  .site-foot a { color: var(--muted); }
  .site-foot a:hover { color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .locked { max-width: 520px; margin: 48px auto; text-align: center; }
  .locked h2 { margin: 0 0 8px; }
  .locked p { color: var(--muted); }
  .locked .row { justify-content: center; margin-top: 16px; }

  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--text);
           padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
  dialog::backdrop { background: rgba(5, 2, 10, .75); }
  .dlg { padding: 20px; }
  .dlg h2 { margin: 0 0 4px; }
  .dlg p.help { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  label .opt { font-weight: 400; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 10px 12px; border-radius: var(--control-radius); border: 1px solid var(--line);
                            background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=file]::file-selector-button { border-radius: var(--control-radius); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .status { margin-top: 12px; min-height: 1.4em; font-weight: 600; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  label.check { display: flex; gap: 8px; align-items: center; font-weight: 400; margin-top: 14px; }
  label.check input { width: auto; accent-color: var(--accent); }
  .credit { font-size: 13px; color: var(--muted); }
  .credit a { color: var(--muted); text-decoration: none; }
  .credit a:hover { color: var(--accent); text-decoration: underline; }
  .credit .ico { width: 1em; height: 1em; vertical-align: -0.125em; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  /* Padding + visible overflow leave room for the Close button's focus ring; dvh accounts for phone toolbars. */
  .lightbox { width: auto; max-width: calc(100vw - 16px); max-height: none; padding: 8px; overflow: visible;
              background: transparent; border: 0; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 120px); max-height: calc(100dvh - 120px);
                  display: block; border-radius: 8px; margin: 0 auto; }
  .lightbox .btn { margin: 14px auto 6px; display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* On phones the filters are too tall to pin; let them scroll away with the page. */
  @media (max-width: 600px) {
    .controls { position: static; }
    /* Floating round add button (FAB) on phones. */
    #openAdd { position: fixed; z-index: 20; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
               width: 60px; height: 60px; padding: 0; border-radius: 50%; display: grid; place-items: center;
               box-shadow: 0 6px 20px rgba(0, 0, 0, .45), 0 0 0 2px var(--bg); }
    #openAdd[hidden] { display: none; }
    #openAdd .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    #openAdd .plus { font-size: 34px; line-height: 1; font-weight: 400; margin-top: -3px; }
    .wrap { padding-bottom: 96px; }
    .seg.view { margin-left: 0; }
  }
  @media (max-width: 860px) {
    /* Too narrow for columns: the table becomes a compact list, thumbnail on the left, details stacked. */
    .tbl thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .tbl, .tbl tbody { display: block; }
    .tbl .dayrow { display: block; }
    .tbl .dayrow th { display: block; }
    .tbl tr.ev-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); column-gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .tbl tr.ev-row td { display: block; padding: 1px 0; border: 0; }
    .tbl .c-flier { grid-row: 1 / span 5; width: auto; }
    .tbl .sub.one { white-space: normal; max-width: none; }
  }
  @media (max-width: 480px) { .two { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; gap: 14px; } }
  @media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } .card:hover { transform: translateY(-2px); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><?= config.title ?></h1>
      <p class="tagline"><?= config.tagline ?></p>
    </div>
    <button class="btn" id="openAdd" type="button" aria-label="Add an event"><span class="plus" aria-hidden="true">+</span><span class="label"> Add an event</span></button>
  </header>

  <div class="controls" role="search">
    <div class="row">
      <label class="sr-only" for="q">Search events</label>
      <input class="search" id="q" type="search" placeholder="Search name, venue, vibe…" autocomplete="off">
    </div>
    <div class="row dates">
      <div class="seg" id="scope" role="group" aria-label="Which events">
        <button type="button" data-scope="spooky" aria-pressed="false">🎃 Spooky only</button>
        <button type="button" data-scope="season" aria-pressed="false">This Season</button>
        <button type="button" data-scope="all" aria-pressed="true">All events</button>
      </div>
      <div class="row" role="group" aria-label="Date range">
        <label for="from">From <input id="from" type="date"></label>
        <label for="to">To <input id="to" type="date"></label>
        <button class="linkbtn" id="resetDates" type="button" hidden>Reset dates</button>
      </div>
      <div class="seg view" id="view" role="group" aria-label="Layout">
        <button type="button" data-view="cards" aria-pressed="true">▦ Cards</button>
        <button type="button" data-view="table" aria-pressed="false">☰ Table</button>
      </div>
    </div>
    <div class="chips" id="types" role="group" aria-label="Filter by type"></div>
  </div>

  <div class="statusbar">
    <span id="updated" class="updated"></span>
    <button class="linkbtn" id="refresh" type="button">↻ Refresh</button>
    <span id="newVersion" class="newver" hidden>A new version is available. <a id="reloadLink" href="#">Reload</a></span>
  </div>
  <main id="list" aria-live="polite"><p class="empty">Summoning events…</p></main>

  <footer class="site-foot">
    <p><?!= config.footerHtml ?>Event details are read from fliers by AI, so double-check the original post before you go.</p>
  </footer>
</div>

<dialog id="addDlg" aria-labelledby="addTitle">
  <form class="dlg" id="addForm" method="dialog">
    <h2 id="addTitle">Add an event</h2>
    <p class="help">Paste a link, upload the flier, or both. We read the flier and fill in the rest. Add details below if there's no flier.</p>

    <label for="f-url">Event link <span class="opt">(Instagram, Facebook, Eventbrite…)</span></label>
    <input id="f-url" name="url" type="url" inputmode="url" placeholder="https://www.instagram.com/p/…">

    <label for="f-img">Flier image <span class="opt">(screenshot works)</span></label>
    <input id="f-img" name="image" type="file" accept="image/*">

    <details>
      <summary>Type in details</summary>
      <label for="f-name">Event name</label>
      <input id="f-name" name="name" maxlength="120">
      <div class="two">
        <div><label for="f-date">Date</label><input id="f-date" name="date" type="date" min="<?= config.from ?>"></div>
        <div><label for="f-time">Time</label><input id="f-time" name="time" placeholder="9pm"></div>
      </div>
      <label for="f-venue">Venue</label>
      <input id="f-venue" name="venue" maxlength="120">
      <label for="f-type">Type</label>
      <select id="f-type" name="type">
        <option value="">Let us guess</option>
        <? config.types.forEach(function (t) { ?><option><?= t ?></option><? }); ?>
      </select>
      <label for="f-desc">What is it? <span class="opt">(one line)</span></label>
      <textarea id="f-desc" name="description" maxlength="300"></textarea>
    </details>

    <label class="check" for="f-credit"><input id="f-credit" name="credit" type="checkbox" checked> Credit the original poster on the listing</label>

    <label for="f-by">Your name <span class="opt">(optional: an FYI for the owner, not listed publicly)</span></label>
    <input id="f-by" name="addedBy" maxlength="60" autocomplete="nickname">
    <div class="hp" aria-hidden="true"><label for="f-website">Website</label><input id="f-website" name="website" tabindex="-1" autocomplete="off"></div>

    <p class="status" id="status" role="status"></p>
    <div class="actions">
      <button class="btn secondary" type="button" id="closeAdd">Close</button>
      <button class="btn" type="submit" id="submitAdd">Add it</button>
    </div>
  </form>
</dialog>

<dialog id="lightbox" class="lightbox" aria-label="Flier">
  <img id="lbImg" alt="">
  <button class="btn" type="button" id="lbClose">Close</button>
</dialog>

<script>
  const TZ_TODAY = new Date();
  const state = { events: [], type: 'All', scope: 'all', q: '', from: '', to: '', custom: false, view: 'cards' };
  // Layout choice is remembered on this device only.
  try { if (localStorage.getItem('hh-view') === 'table') state.view = 'table'; } catch (err) { /* private mode */ }
  // Halloween colors first, then around the rainbow. All are light enough to read on the dark cards.
  const TYPE_COLORS = {
    'Dance party': '#ff8a3d',     // pumpkin
    'Costume contest': '#ffcf3d', // candy corn
    'Drag': '#b98cff',            // witch purple
    'Burlesque': '#ff5c6c',       // blood red
    'Film': '#8be36a',            // slime green
    'Music show': '#e9e2d0',      // bone
    'Theater': '#ff8fc0',         // pink
    'Art show': '#ff9f80',        // coral
    'Comedy': '#d4f06a',          // lime
    'Workshop': '#3fd8c2',        // teal
    'Market': '#63c5ff',          // sky
    'Community': '#8fa2ff',       // periwinkle
    'Fundraiser': '#e38cff',      // orchid
    'Kids & family': '#a8f0c6',   // mint
    'Other': '#a9a3b5',           // ghost gray
  };
  const typeColor = (t) => TYPE_COLORS[t] || TYPE_COLORS.Other;
  const SEASON_END = <?!= jsonForScript_(config.seasonEnd) ?>;
  const KEEP_FROM = <?!= jsonForScript_(config.from) ?>;
  const inScope = (e) => (state.scope !== 'spooky' || e.spooky) && e.date >= state.from && e.date <= state.to;

  // Each option has a default date range; picking dates by hand overrides it until reset or the option changes.
  function defaultRange() {
    // Late-night events from yesterday stay listed until they end, so start at the earliest one shown.
    const earliest = state.events.reduce((m, e) => (e.date < m ? e.date : m), ymd(TZ_TODAY));
    const today = earliest > KEEP_FROM ? earliest : KEEP_FROM;
    const last = state.events.reduce((m, e) => (e.date > m ? e.date : m), SEASON_END);
    return [today, state.scope === 'all' ? last : SEASON_END];
  }
  function setRange(from, to) {
    if (from && to && from > to) [from, to] = [to, from];
    const [defFrom, defTo] = defaultRange();
    state.from = from || defFrom;
    state.to = to || defTo;
    $('from').value = state.from; $('to').value = state.to;
    $('from').min = $('to').min = defFrom;
    $('resetDates').hidden = state.from === defFrom && state.to === defTo;
  }
  const $ = (id) => document.getElementById(id);

  function esc(s) { return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parse(ymdStr) { const [y, m, d] = ymdStr.split('-').map(Number); return new Date(y, m - 1, d, 12); }
  function dayLabel(ymdStr) {
    const d = parse(ymdStr);
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function relLabel(ymdStr) {
    const today = ymd(TZ_TODAY);
    const tmr = new Date(TZ_TODAY); tmr.setDate(tmr.getDate() + 1);
    if (ymdStr === today) return 'Today';
    if (ymdStr === ymd(tmr)) return 'Tomorrow';
    if (ymdStr.slice(5) === '10-31') return 'Halloween';
    return '';
  }
  function thumb(id, w) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w; }

  function render() {
    renderChips();
    const q = state.q.trim().toLowerCase();
    const shown = state.events.filter((e) =>
      (state.type === 'All' || e.type === state.type) &&
      inScope(e) &&
      (!q || [e.name, e.venue, e.description, e.type].join(' ').toLowerCase().includes(q)));

    if (!shown.length) {
      $('list').innerHTML = '<p class="empty">' + (state.events.length ? 'Nothing matches those filters.' : 'No events yet. Be the first to add one!') + '</p>';
      return;
    }
    const days = [];
    shown.forEach((e) => { const last = days[days.length - 1]; if (last && last.date === e.date) last.items.push(e); else days.push({ date: e.date, items: [e] }); });
    if (state.view === 'table') {
      $('list').innerHTML = renderTable(days);
      return;
    }
    $('list').innerHTML = days.map((d) =>
      '<section class="day" aria-labelledby="d-' + esc(d.date) + '"><h2 id="d-' + esc(d.date) + '">' + dayHeading(d) +
      '</h2><div class="grid">' + d.items.map(card).join('') + '</div></section>').join('');
  }

  // Font Awesome Free 6.5.2 icons (CC BY 4.0, fontawesome.com/license/free), inlined so no CDN is needed.
  const ICONS = {
    instagram: '<svg class="ico" viewBox="0 0 448 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM398.8 388c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-132.1 9s-102.7 2.6-132.1-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-132.1s-2.6-102.7 9-132.1c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 132.1-9s102.7-2.6 132.1 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 132.1s2.7 102.7-9 132.1z"/></svg>',
    facebook: '<svg class="ico" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M512 256C512 114.6 397.4 0 256 0S0 114.6 0 256C0 376 82.7 476.8 194.2 504.5V334.2H141.4V256h52.8V222.3c0-87.1 39.4-127.5 125-127.5c16.2 0 44.2 3.2 55.7 6.4V172c-6-.6-16.5-1-29.6-1c-42 0-58.2 15.9-58.2 57.2V256h83.6l-14.4 78.2H287V510.1C413.8 494.8 512 386.9 512 256h0z"/></svg>',
    globe: '<svg class="ico" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M352 256c0 22.2-1.2 43.6-3.3 64H163.3c-2.2-20.4-3.3-41.8-3.3-64s1.2-43.6 3.3-64H348.7c2.2 20.4 3.3 41.8 3.3 64zm28.8-64H503.9c5.3 20.5 8.1 41.9 8.1 64s-2.8 43.5-8.1 64H380.8c2.1-20.6 3.2-42 3.2-64s-1.1-43.4-3.2-64zm112.6-32H376.7c-10-63.9-29.8-117.4-55.3-151.6c78.3 20.7 142 77.5 171.9 151.6zm-149.1 0H167.7c6.1-36.4 15.5-68.6 27-94.7c10.5-23.6 22.2-40.7 33.5-51.5C239.4 3.2 248.7 0 256 0s16.6 3.2 27.8 13.8c11.3 10.8 23 27.9 33.5 51.5c11.6 26 20.9 58.2 27 94.7zm-209 0H18.6C48.6 85.9 112.2 29.1 190.6 8.4C165.1 42.6 145.3 96.1 135.3 160zM8.1 192H131.2c-2.1 20.6-3.2 42-3.2 64s1.1 43.4 3.2 64H8.1C2.8 299.5 0 278.1 0 256s2.8-43.5 8.1-64zM194.7 446.6c-11.6-26-20.9-58.2-27-94.6H344.3c-6.1 36.4-15.5 68.6-27 94.6c-10.5 23.6-22.2 40.7-33.5 51.5C272.6 508.8 263.3 512 256 512s-16.6-3.2-27.8-13.8c-11.3-10.8-23-27.9-33.5-51.5zM135.3 352c10 63.9 29.8 117.4 55.3 151.6C112.2 482.9 48.6 426.1 18.6 352H135.3zm358.1 0c-30 74.1-93.6 130.9-171.9 151.6c25.5-34.2 45.2-87.7 55.3-151.6H493.4z"/></svg>',
    image: '<svg class="ico" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path fill="currentColor" d="M0 96C0 60.7 28.7 32 64 32H448c35.3 0 64 28.7 64 64V416c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V96zM323.8 202.5c-4.5-6.6-11.9-10.5-19.8-10.5s-15.4 3.9-19.8 10.5l-87 127.6L170.7 297c-4.6-5.7-11.5-9-18.7-9s-14.2 3.3-18.7 9l-64 80c-5.8 7.2-6.9 17.1-2.9 25.4s12.4 13.6 21.6 13.6h96 32H424c8.9 0 17.1-4.9 21.2-12.8s3.6-17.4-1.4-24.7l-120-176zM112 192a48 48 0 1 0 0-96 48 48 0 1 0 0 96z"/></svg>',
  };
  // Where the post came from, shown as an icon before the account name.
  function creditHtml(e) {
    // No link means it came from an uploaded photo (the name was read off the flier).
    if (!/^https?:\/\//i.test(e.creditLink)) {
      return ICONS.image + ' <span class="sr-only">From the flier: </span>' + esc(e.credit);
    }
    const host = e.creditLink.replace(/^https?:\/\/(www\.|m\.)?/i, '').split('/')[0].toLowerCase();
    const [icon, site] = host.endsWith('instagram.com') ? [ICONS.instagram, 'Instagram']
      : host.endsWith('facebook.com') ? [ICONS.facebook, 'Facebook']
      : [ICONS.globe, 'Website'];
    return '<a href="' + esc(e.creditLink) + '" target="_blank" rel="noopener noreferrer">' +
      icon + ' <span class="sr-only">' + site + ': </span>' + esc(e.credit) +
      '<span class="sr-only"> (opens in new tab)</span></a>';
  }

  // Blank or "Unknown" in the sheet: say so quietly rather than guessing "Free".
  function priceText(e) {
    const p = String(e.price || '').trim();
    return !p || /^unknown$/i.test(p) ? '<span class="unknown">Price unknown</span>' : esc(p);
  }

  function tagHtml(e) {
    return '<button class="tag" type="button" data-tag="' + esc(e.type) + '" style="--c:' + typeColor(e.type) + '"' +
      ' aria-pressed="' + (state.type === e.type) + '" aria-label="Show only ' + esc(e.type) + ' events">' +
      (e.spooky ? '🎃 ' : '') + esc(e.type) + '</button>';
  }

  function postLink(e, label) {
    return /^https?:\/\//i.test(e.link) ? '<a href="' + esc(e.link) + '" target="_blank" rel="noopener noreferrer">' + label +
      '<span class="sr-only"> for ' + esc(e.name) + ' (opens in new tab)</span> ↗</a>' : '';
  }

  function dayHeading(d) {
    const rel = relLabel(d.date);
    return esc(dayLabel(d.date)) + (rel ? ' <span class="rel">' + rel + '</span>' : '') +
      ' <span class="count">(' + d.items.length + (d.items.length === 1 ? ' event' : ' events') + ')</span>';
  }

  function card(e) {
    const flier = e.flierId
      ? '<button class="flier" type="button" data-flier="' + esc(e.flierId) + '" aria-label="View flier for ' + esc(e.name) + '"><img loading="lazy" src="' + thumb(e.flierId, 600) + '" alt=""></button>'
      : '<div class="flier none" aria-hidden="true">🦇</div>';
    const meta = esc(e.venue);
    return '<article class="card">' + flier + '<div class="body">' +
      (e.time ? '<div class="when">' + esc(e.time) + '</div>' : '') +
      '<h3>' + esc(e.name) + '</h3>' +
      (meta ? '<div class="meta">' + meta + '</div>' : '') +
      '<div class="price"><span aria-hidden="true">🎟 </span>' + priceText(e) + '</div>' +
      (e.ntaflof ? '<div class="ntaflof">No one turned away for lack of funds</div>' : '') +
      (e.description ? '<p class="desc">' + esc(e.description) + '</p>' : '') +
      (e.credit ? '<div class="credit">' + creditHtml(e) + '</div>' : '') +
      '<div class="foot">' + tagHtml(e) + postLink(e, 'Original post') + '</div></div></article>';
  }

  function tableRow(e) {
    const flier = e.flierId
      ? '<button class="mini" type="button" data-flier="' + esc(e.flierId) + '" aria-label="View flier for ' + esc(e.name) + '"><img loading="lazy" src="' + thumb(e.flierId, 160) + '" alt=""></button>'
      : '<span class="mini none" aria-hidden="true">🦇</span>';
    return '<tr class="ev-row">' +
      '<td class="c-flier">' + flier + '</td>' +
      '<td class="c-time">' + esc(e.time || '–') + '</td>' +
      '<td class="c-event"><strong>' + esc(e.name) + '</strong>' +
        (e.venue ? '<div class="sub">' + esc(e.venue) + '</div>' : '') +
        (e.description ? '<div class="sub one">' + esc(e.description) + '</div>' : '') + '</td>' +
      '<td class="c-type">' + tagHtml(e) + '</td>' +
      '<td class="c-price">' + priceText(e) + (e.ntaflof ? '<div class="sub ok">No one turned away</div>' : '') + '</td>' +
      '<td class="c-src">' + (e.credit ? '<div class="credit">' + creditHtml(e) + '</div>' : '') + postLink(e, 'Post') + '</td>' +
      '</tr>';
  }

  function renderTable(days) {
    return '<div class="tbl-wrap"><table class="tbl"><caption class="sr-only">Events, grouped by day</caption><thead><tr>' +
      '<th scope="col"><span class="sr-only">Flier</span></th><th scope="col">Time</th><th scope="col">Event</th>' +
      '<th scope="col">Type</th><th scope="col">Price</th><th scope="col">Source</th></tr></thead>' +
      days.map((d) => '<tbody><tr class="dayrow"><th scope="rowgroup" colspan="6">' + dayHeading(d) + '</th></tr>' +
        d.items.map(tableRow).join('') + '</tbody>').join('') + '</table></div>';
  }

  function renderChips() {
    const counts = {};
    const scoped = state.events.filter(inScope);
    scoped.forEach((e) => { counts[e.type] = (counts[e.type] || 0) + 1; });
    if (state.type !== 'All' && !counts[state.type]) state.type = 'All';
    const types = ['All'].concat(Object.keys(counts).sort((a, b) => counts[b] - counts[a]));
    $('types').innerHTML = types.map((t) =>
      '<button class="chip" type="button" data-type="' + esc(t) + '" aria-pressed="' + (state.type === t) + '"' +
      (t === 'All' ? '>' : ' style="--c:' + typeColor(t) + '"><span class="dot" aria-hidden="true"></span>') + esc(t) +
      '<span class="n">(' + (t === 'All' ? scoped.length : counts[t]) + ')</span></button>').join('');
  }

  // Invite-only mode: the code comes from the invite link once, then this browser remembers it.
  const INVITE_KEY = 'hh-invite';
  const store = {
    get() { try { return localStorage.getItem(INVITE_KEY) || ''; } catch (err) { return ''; } },
    set(v) { try { v ? localStorage.setItem(INVITE_KEY, v) : localStorage.removeItem(INVITE_KEY); } catch (err) { /* private mode */ } },
  };
  state.invite = <?!= jsonForScript_(config.invite || '') ?> || store.get();

  function showLocked() {
    document.querySelector('.controls').hidden = true;
    document.querySelector('.statusbar').hidden = true;
    $('openAdd').hidden = true;
    $('list').innerHTML =
      '<div class="locked"><h2>🔒 This list is invite-only</h2>' +
      '<p>Ask a friend for the invite link. If you have the link or code, paste it here:</p>' +
      '<form id="inviteForm" class="row"><label class="sr-only" for="inviteCode">Invite link or code</label>' +
      '<input id="inviteCode" class="search" autocomplete="off" placeholder="Invite link or code">' +
      '<button class="btn" type="submit">Let me in</button></form>' +
      '<p class="status bad" id="inviteStatus" role="status"></p></div>';
    $('inviteForm').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const raw = $('inviteCode').value.trim();
      state.invite = (raw.match(/invite=([A-Za-z0-9]+)/) || [])[1] || raw;
      state.triedCode = true;
      load();
    });
  }

  const PAGE_VERSION = <?!= jsonForScript_(config.version) ?>;
  const PAGE_URL = <?!= jsonForScript_(config.pageUrl || '') ?>;
  let lastLoaded = 0;
  let lastData = '';

  function showUpdated() {
    if (!lastLoaded) return;
    const mins = Math.floor((Date.now() - lastLoaded) / 60000);
    $('updated').textContent = mins < 1 ? 'Updated just now' : 'Updated ' + mins + ' min ago';
  }
  setInterval(showUpdated, 30000);

  // quiet = background refresh: don't flash "loading" or replace the list on a hiccup.
  function load(quiet) {
    if (!quiet) $('updated').textContent = 'Loading…';
    google.script.run
      .withSuccessHandler((res) => {
        checkVersion();
        if (res.locked) {
          store.set('');
          const retry = state.triedCode;
          showLocked();
          if (retry) $('inviteStatus').textContent = "That invite didn't work. It may have been replaced with a new one.";
          return;
        }
        if (state.invite) store.set(state.invite);
        document.querySelector('.controls').hidden = false;
        document.querySelector('.statusbar').hidden = false;
        $('openAdd').hidden = false;
        lastLoaded = Date.now();
        showUpdated();
        const data = JSON.stringify(res.events);
        if (quiet && data === lastData) return; // nothing changed; leave the page alone
        lastData = data;
        state.events = res.events;
        setRange(state.custom && state.from, state.custom && state.to);
        render();
      })
      .withFailureHandler(() => {
        if (quiet) return;
        $('updated').textContent = "Couldn't refresh. Check your connection and try again.";
        if (!state.events.length) $('list').innerHTML = '<p class="empty">Couldn\'t load events. Tap Refresh to try again.</p>';
      })
      .getEvents(state.invite);
  }

  // An open page keeps talking to the code it was loaded with, so ask the live page directly.
  function checkVersion() {
    if (!PAGE_URL || !window.fetch) return;
    fetch(PAGE_URL + '?format=version', { credentials: 'omit' })
      .then((r) => r.json())
      .then((v) => {
        if (!v || !v.version || v.version === PAGE_VERSION) return;
        $('reloadLink').href = PAGE_URL + (state.invite ? '?invite=' + encodeURIComponent(state.invite) : '');
        $('newVersion').hidden = false;
      })
      .catch(() => { /* offline or blocked; try again next refresh */ });
  }

  $('refresh').addEventListener('click', () => load(false));
  $('reloadLink').addEventListener('click', (ev) => {
    if ($('reloadLink').getAttribute('href') === '#') { ev.preventDefault(); location.reload(); }
  });
  // Home Screen apps stay in memory: refresh when it comes back to the foreground, and every 5 minutes while open.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastLoaded > 60000) load(true);
  });
  setInterval(() => { if (document.visibilityState === 'visible') load(true); }, 5 * 60000);

  $('types').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-type]'); if (!b) return;
    // Clicking the active type again turns it off.
    state.type = state.type === b.dataset.type ? 'All' : b.dataset.type;
    render();
    const active = $('types').querySelector('[data-type="' + CSS.escape(b.dataset.type) + '"]');
    if (active) active.focus({ preventScroll: true });
  });
  function syncView() {
    $('view').querySelectorAll('[data-view]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.view === state.view));
  }
  syncView();
  $('view').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-view]'); if (!b) return;
    state.view = b.dataset.view;
    try { localStorage.setItem('hh-view', state.view); } catch (err) { /* private mode */ }
    syncView();
    render();
  });
  $('scope').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-scope]'); if (!b) return;
    state.scope = b.dataset.scope;
    $('scope').querySelectorAll('[data-scope]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    state.custom = false;
    setRange();
    render();
  });
  ['from', 'to'].forEach((id) => $(id).addEventListener('change', () => {
    state.custom = true;
    setRange($('from').value, $('to').value);
    render();
  }));
  $('resetDates').addEventListener('click', () => { state.custom = false; setRange(); render(); $('from').focus(); });
  let t; $('q').addEventListener('input', (ev) => { clearTimeout(t); t = setTimeout(() => { state.q = ev.target.value; render(); }, 150); });

  $('list').addEventListener('click', (ev) => {
    const tag = ev.target.closest('[data-tag]');
    if (tag) {
      // Clicking the active type again clears the filter.
      state.type = state.type === tag.dataset.tag ? 'All' : tag.dataset.tag;
      render();
      window.scrollTo({ top: $('list').offsetTop - document.querySelector('.controls').offsetHeight });
      const chip = $('types').querySelector('[aria-pressed="true"]');
      if (chip) { chip.scrollIntoView({ block: 'nearest', inline: 'nearest' }); chip.focus({ preventScroll: true }); }
      return;
    }
    const b = ev.target.closest('[data-flier]'); if (!b) return;
    const e = state.events.find((x) => x.flierId === b.dataset.flier);
    $('lbImg').src = thumb(b.dataset.flier, 1600);
    $('lbImg').alt = 'Flier for ' + (e ? e.name : 'event');
    $('lightbox').showModal();
  });
  $('lbClose').addEventListener('click', () => $('lightbox').close());
  $('lightbox').addEventListener('click', (ev) => { if (ev.target === $('lightbox')) $('lightbox').close(); });

  $('openAdd').addEventListener('click', () => { $('status').textContent = ''; $('status').className = 'status'; $('addDlg').showModal(); $('f-url').focus(); });
  $('closeAdd').addEventListener('click', () => $('addDlg').close());

  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85).split(',')[1];
  }

  $('addForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.currentTarget;
    const data = Object.fromEntries(new FormData(f).entries());
    delete data.image;
    data.credit = $('f-credit').checked ? 'on' : 'off';
    data.invite = state.invite;
    const file = $('f-img').files[0];
    const status = $('status');
    if (!data.url && !file && !(data.name && data.date)) {
      status.className = 'status bad';
      status.textContent = 'Add a link, a flier, or at least a name and date.';
      return;
    }
    $('submitAdd').disabled = true;
    status.className = 'status';
    status.textContent = file || data.url ? 'Reading the flier… (takes ~15 seconds)' : 'Adding…';
    try {
      if (file) { data.imageBase64 = await shrink(file); data.mimeType = 'image/jpeg'; }
    } catch (err) {
      status.className = 'status bad'; status.textContent = 'Couldn\'t read that image. Try a screenshot (JPG or PNG).';
      $('submitAdd').disabled = false; return;
    }
    google.script.run
      .withSuccessHandler((res) => {
        $('submitAdd').disabled = false;
        if (res.locked) { $('addDlg').close(); showLocked(); return; }
        status.className = 'status ' + (res.ok ? 'ok' : 'bad');
        status.textContent = res.message;
        if (res.ok) { f.reset(); load(); }
      })
      .withFailureHandler(() => {
        $('submitAdd').disabled = false;
        status.className = 'status bad'; status.textContent = 'Something went wrong. Try again in a minute.';
      })
      .submitFromPage(data);
  });

  load();
</script>
</body>
</html>
